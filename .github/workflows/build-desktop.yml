name: Build desktop applications
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'akta_plotter/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/build-desktop.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15-intel
            artifact: macos-intel
          - os: macos-15
            artifact: macos-apple-silicon
          - os: ubuntu-22.04
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c "import os; from akta_plotter import __version__; assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag and app version differ'"
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        run: python scripts/build_desktop.py
      - name: Verify bundled runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/AKTA-Plotter/AKTA-Plotter.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Bundled self-test failed: $($p.ExitCode)" }
          $p = Start-Process -FilePath dist/AKTA-Plotter/AKTA-Plotter.exe -ArgumentList '--gui-smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "GUI smoke test failed: $($p.ExitCode)" }
      - name: Verify bundled runtime (Mac)
        if: runner.os == 'macOS'
        run: |
          dist/AKTA-Plotter.app/Contents/MacOS/AKTA-Plotter --self-test
          dist/AKTA-Plotter.app/Contents/MacOS/AKTA-Plotter --gui-smoke-test
      - name: Verify bundled runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/AKTA-Plotter/AKTA-Plotter --self-test
          MPLBACKEND=TkAgg xvfb-run -a dist/AKTA-Plotter/AKTA-Plotter --gui-smoke-test
      - name: Package app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --sequesterRsrc --keepParent dist/AKTA-Plotter.app dist/AKTA-Plotter-${{ matrix.artifact }}.zip
          elif [ "$RUNNER_OS" = Linux ]; then
            tar -C dist -czf dist/AKTA-Plotter-${{ matrix.artifact }}.tar.gz AKTA-Plotter
          else
            python -c "import shutil; shutil.make_archive('dist/AKTA-Plotter-${{ matrix.artifact }}', 'zip', 'dist', 'AKTA-Plotter')"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AKTA-Plotter-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: AKTA-Plotter-*
          path: release-assets
          merge-multiple: true
      - name: Validate archives and checksums
        run: python scripts/prepare_release.py release-assets
      - name: Create complete draft and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -s "$notes"
          if gh release view "$GITHUB_REF_NAME" --json isDraft > /tmp/akta-release.json; then
            python -c "import json; assert json.load(open('/tmp/akta-release.json'))['isDraft'], 'Release is already published; refusing to replace it'"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "AKTA Plotter ${GITHUB_REF_NAME}" --notes-file "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
